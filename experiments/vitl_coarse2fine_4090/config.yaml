# Overrides merged on top of src/smri_mae/config/default_pretrain.yaml
# (main_pretrain.py --cfg-path). Identical to ../../smri-fm/experiments/
# vitl_baseline_4090/config.yaml in every respect except model_kwargs.coarse_to_fine
# -- this repo's model_mae.py is otherwise verified bit-identical to the plain
# baseline's when coarse_to_fine=false, so this is a clean single-variable
# comparison (coarse-to-fine decoding on vs off) against that baseline run.
#
# Same data cache, same batch/accum, same schedule, same everything else --
# see the baseline config's comments for the reasoning (smoke-tested batch
# size, why the data is a local subset, etc.), not repeated here.

name: vitl_coarse2fine_4090
notes: >
  Coarse-to-fine decoding trick (decoder guesses each masked patch's
  block-averaged shape first, then a fine residual on top) applied on top
  of the same ViT-L / full-resolution / FOMO300+DWI baseline recipe as
  vitl_baseline_4090 in the sibling smri-fm repo. Single-variable comparison:
  everything else is identical to that baseline run.

model_kwargs:
  coarse_to_fine: true
  coarse_factor: 2
  coarse_loss_weight: 1.0

output_dir: checkpoints/experiments

batch_size: 12
accum_iter: 5

datasets:
  fomo_train:
    url: /workspace/data/fomo_dwi_subset/train/shard.{000000..000059}.tar
    samples_per_epoch: 9000
    shuffle: true
    buffer_size: 8000
    drop_last: true

  fomo_val:
    url: /workspace/data/fomo_dwi_subset/val/shard.{001621..001626}.tar
    samples_per_epoch: 900
    shuffle: false
    buffer_size: 900
    drop_last: false

checkpoint_period: 20
max_checkpoints: 1

wandb: true
wandb_entity: palinaskipar-zdro-tech
wandb_project: smri-fm-vitl-baseline-4090
