# Overrides merged on top of src/smri_mae/config/default_pretrain.yaml.
#
# Multi-scale decoder input: instead of feeding the MAE decoder only the
# encoder's final-layer output, fuse three intermediate encoder layers
# (after blocks 7, 15, 23 of this ViT-L's 24) via a per-tap LayerNorm +
# concat + Linear projection back to embed_dim (see MaskedEncoder in
# src/smri_mae/model_mae.py -- multiscale_layers kwarg). Hypothesis: this
# pretrains the intermediate layers to carry useful spatial detail (not
# just the final layer), which should help the segmentation-style FOMO26
# downstream tasks (meningioma, trigeminal nerve/vessel) that need both
# coarse and fine spatial information, more than a plain single-scale MAE
# would. multiscale_layers=None (unset) reproduces the exact baseline
# architecture -- verified via test_multiscale.py (disabled path is the
# original code, unchanged; enabled path checked for correct shapes and
# gradient flow through the new fusion layer).
#
# Otherwise identical to the vitl_targetnorm_full recipe (same as Mihir's
# pretrain_full_90_10_h100_4gpu_gbs64 baseline): same img_size, patch_size,
# mask_ratio, epochs, warmup, lr, full FOMO300+DWI dataset.
#
# batch_size/accum_iter: finalized after smoke tests at bs 16/24/32/64 (all
# completed end-to-end; bs64 peaked at ~69.5GB, well under the 96GB
# available). batch_size=64/accum_iter=1 gives global batch 64, matching
# Mihir's gbs64 baseline recipe on this single GPU.

name: vitl_multiscale_full
notes: >
  Multi-scale decoder input (fuse encoder blocks 7/15/23 of 24, instead of
  only the final block) applied on top of the same ViT-L / full-resolution
  / full FOMO300+DWI data recipe as vitl_targetnorm_full / Mihir's baseline.
  Single-variable comparison: everything else is identical to that recipe.

model: mae_vit_large
img_size: [208, 240, 208]
patch_size: 8
mask_ratio: 0.8

model_kwargs:
  target_norm: none
  decoder_depth: 4
  reg_tokens: 0
  class_token: true
  no_embed_class: false
  mask_drop_scale: false
  drop_path_rate: 0.0
  multiscale_layers: [7, 15, 23]

output_dir: /mnt/nvme/projects/training-pure-ViT-real-life-bench/checkpoints/experiments/vitl_multiscale_full

datasets:
  fomo_train:
    url: /mnt/nvme/projects/training-pure-ViT-real-life-bench/datasets/FOMO300/wds_with_dwi/shard.{000000..001620}.tar
    samples_per_epoch: 243200
    shuffle: true
    buffer_size: 8000
    drop_last: true
  fomo_val:
    url: /mnt/nvme/projects/training-pure-ViT-real-life-bench/datasets/FOMO300/wds_with_dwi/shard.{001621..001800}.tar
    samples_per_epoch: 26880
    shuffle: false
    buffer_size: 1000
    drop_last: false

train_dataset: fomo_train
eval_datasets: [fomo_val]

epochs: 100
warmup_epochs: 10
batch_size: 64
accum_iter: 1
base_lr: 0.001
min_lr: 1.0e-06
weight_decay: 0.05
betas: [0.9, 0.95]
clip_grad: 1.0

amp: true
amp_dtype: bfloat16

num_workers: 8
prefetch_factor: 2
presend_cuda: true

checkpoint_period: 5
max_checkpoints: 3

hf_repo_id: pau99/fomo26-checkpoints
hf_subfolder: smri-fm-vitl-fulldata/multiscale

wandb: true
wandb_entity: palinaskipar-zdro-tech
wandb_project: smri-fm-vitl-fulldata

seed: 7338
eval_seed: 7338
