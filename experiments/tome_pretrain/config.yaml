# Overrides merged on top of src/smri_mae/config/default_pretrain.yaml
# (main_pretrain.py --cfg-path). Only lists what differs from the default
# pretraining run, so this experiment stays a single-variable comparison
# (Token Merging on vs off) against the baseline config.
#
# See experiments/tome_pretrain/README.md for background and how to run.

name: tome_pretrain
notes: >
  Token Merging (Bolya et al. 2022, https://arxiv.org/abs/2210.09461) in the
  MAE encoder. Merges tome_r token pairs per block (patch tokens only,
  cls/reg tokens excluded). See src/smri_mae/tome.py.

# mae_vit_large (316M params, default_pretrain.yaml's default) is far bigger
# than the ResEncUNet-B/U-Net-B/Primus-S checkpoints this experiment is meant
# to be comparable to. mae_vit_small (embed_dim=384, depth=12) is close to
# Primus-S's own size (embed_dim=396, depth=12) -- the closest match
# available among mae_vit_* variants.
model: mae_vit_small

model_kwargs:
  tome_r: 16

# Keep this experiment's checkpoints separate from any other run.
output_dir: checkpoints/experiments

r2_sync: null

# img_size doubles as the local_pt_dataset random-crop size (see
# src/data/local_pt_dataset.py). 160cube matches the crop size your
# ResEncUNet-B/U-Net-B asparagus runs used -- also fixes the resolution
# mismatch flagged earlier, and (more importantly) volumes must have every
# spatial dim >= this to be usable at all without padding: at the original
# 208x240x208 full-volume approach, 82% of scans were mostly zero-padding
# (every DWI/perfusion file included), silently wasting most of the training
# budget. At 160cube, 131/965 files across the whole dataset pass the filter
# -- all real content, no padding. See the module docstring and
# experiments/tome_pretrain/README.md for the full accounting.
img_size: [160, 160, 160]

# asparagus's precomputed split_99_01_00.json assumes ~all files are usable,
# which badly breaks down once local_pt_dataset filters by crop-size fit --
# its 10-file val split had only 1 file survive. local_pt_source points both
# fomo_train and fomo_val at the same full pool (paths.json, all 975 files);
# create_local_data_loaders filters once and splits the *usable* 131 itself
# (local_pt_val_fraction below), so both sides end up non-trivially sized.
local_pt_source: /workspace/fomo26/processed_data/PT902_FOMO300K_HF/paths.json
local_pt_val_fraction: 0.1

# ~118 usable train files (131 usable x 90%) x epochs. Still targeting ~15k
# gradient steps to match the asparagus runs' step count -- at effective
# batch 16, that's ~7 optimizer steps per epoch, so epochs is large mostly
# because "epoch" is now a much smaller unit, not because training runs 8x
# longer in wall-clock terms.
epochs: 2150
warmup_epochs: 215

wandb: true
wandb_entity: palinaskipar-zdro-tech
wandb_project: smri-fm-tome

# datasets.*.paths is ignored when local_pt_source (above) is set -- kept
# here only so `format: local_pt` still selects the local-file code path.
# See src/data/local_pt_dataset.py and experiments/tome_pretrain/README.md.
datasets:
  fomo_train:
    format: local_pt
    shuffle: true
    drop_last: true

  fomo_val:
    format: local_pt
    shuffle: false
    drop_last: false

# default_pretrain.yaml's batch_size=64 targets multi-GPU H100 training; a
# single 4090 needs much smaller per-step batches. accum_iter recovers a
# larger effective batch size. Measured ~6.4GB peak at the old 208x240x208
# resolution -- 160cube crops use less, may be able to push batch size
# higher, untested at the new resolution.
batch_size: 8
accum_iter: 2
num_workers: 4
