# Overrides merged on top of src/smri_mae/config/default_pretrain.yaml
# (main_pretrain.py --cfg-path). Only lists what differs from the default
# pretraining run, so this experiment stays a single-variable comparison
# (Token Merging on vs off) against the baseline config.
#
# See experiments/tome_pretrain/README.md for background and how to run.

name: tome_pretrain
notes: >
  Token Merging (Bolya et al. 2022, https://arxiv.org/abs/2210.09461) in the
  MAE encoder. Merges tome_r token pairs per block (patch tokens only,
  cls/reg tokens excluded). See src/smri_mae/tome.py.

# mae_vit_large (316M params, default_pretrain.yaml's default) is far bigger
# than the ResEncUNet-B/U-Net-B/Primus-S checkpoints this experiment is meant
# to be comparable to. mae_vit_small (embed_dim=384, depth=12) is close to
# Primus-S's own size (embed_dim=396, depth=12) -- the closest match
# available among mae_vit_* variants.
model: mae_vit_small

model_kwargs:
  tome_r: 16

# Keep this experiment's checkpoints separate from any other run.
output_dir: checkpoints/experiments

r2_sync: null

# img_size doubles as the local_pt_dataset random-crop size (see
# src/data/local_pt_dataset.py). 160cube matches the crop size your
# ResEncUNet-B/U-Net-B asparagus runs used, and also fixes the resolution
# mismatch flagged earlier vs. the original full 208x240x208 volumes.
#
# Note on data quality: ~83% of this dataset's 965 files fill <30% of any
# reasonable fixed crop (checked at both 208x240x208 and 160cube -- barely
# changes with target size), because a meaningful chunk of them (all 139
# DWI/perfusion files, plus many undersized anat scans) are inherently
# thin-slice sequences, not full 3D anatomical volumes. That's a property of
# this specific dataset, not fixable by choosing a smarter crop -- so rather
# than filtering those files out (which would cut the dataset to ~131 files,
# losing the ~1000-scan comparability with the ResEncUNet-B/U-Net-B/Primus-S
# checkpoints this is meant to be comparable to), all 965 files are kept.
# This is not a training-*correctness* problem regardless: img_mask already
# excludes padded/invalid voxels from both context and loss (see
# MaskedAutoencoderViT.prepare_masks) -- low-fill files just contribute less
# signal per sample, and ToMe merges less on them since there's less real
# content to merge, not incorrectly. See src/data/local_pt_dataset.py's
# module docstring and experiments/tome_pretrain/README.md for the full
# accounting including the filtered-131-file alternative.
img_size: [160, 160, 160]

epochs: 250
warmup_epochs: 25

wandb: true
wandb_entity: palinaskipar-zdro-tech
wandb_project: smri-fm-tome

# All 965/10 files from asparagus's own split (fold 0) -- see the img_size
# comment above for why nothing is filtered out here.
datasets:
  fomo_train:
    format: local_pt
    paths: /workspace/fomo26/processed_data/PT902_FOMO300K_HF/split_99_01_00.json#train
    shuffle: true
    drop_last: true

  fomo_val:
    format: local_pt
    paths: /workspace/fomo26/processed_data/PT902_FOMO300K_HF/split_99_01_00.json#val
    shuffle: false
    drop_last: false

# default_pretrain.yaml's batch_size=64 targets multi-GPU H100 training; a
# single 4090 needs much smaller per-step batches. accum_iter recovers a
# larger effective batch size. Measured ~6.4GB peak at the old 208x240x208
# resolution -- 160cube crops use less, may be able to push batch size
# higher, untested at the new resolution.
batch_size: 8
accum_iter: 2
num_workers: 4
