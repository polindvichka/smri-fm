# Overrides merged on top of src/smri_mae_edgeloss/config/default_pretrain.yaml
# (main_pretrain.py --cfg-path). Same comparability decisions as the sibling
# ToMe experiment (see /workspace/smri-fm-tome/experiments/tome_pretrain/):
# mae_vit_small (not the 316M-param default mae_vit_large) to stay in the
# same capacity ballpark as the ResEncUNet-B/U-Net-B/Primus-S checkpoints
# this is meant to be comparable to, and epochs picked to match total
# gradient steps (not just total samples) against those runs' 15,000 steps.
#
# See experiments/edgeloss_pretrain/README.md for background and how to run.

name: edgeloss_pretrain
notes: >
  Edge-aware loss reweighting in the MAE reconstruction loss: upweights
  voxels near high-gradient tissue boundaries relative to flat interior
  regions, so the model is pushed to get anatomical boundaries right instead
  of coasting on easy flat regions that dominate by voxel count.
  See src/smri_mae_edgeloss/model_mae.py (prepare_edge_weights,
  gradient_magnitude_3d). edge_loss_weight=0 reproduces the unweighted MAE
  loss exactly (verified bit-identical against the original smri_mae code).

model: mae_vit_small

model_kwargs:
  edge_loss_weight: 2.0

output_dir: checkpoints/experiments

r2_sync: null

# img_size doubles as the local_pt_dataset random-crop size. 160cube matches
# the ResEncUNet-B/U-Net-B asparagus crop size, fixing the resolution
# mismatch vs. the original full 208x240x208 approach.
#
# Note on data quality: ~83% of this dataset's 965 files fill <30% of any
# reasonable fixed crop (checked at both 208x240x208 and 160cube -- barely
# changes with target size), since a meaningful chunk (all 139 DWI/perfusion
# files, plus many undersized anat scans) are inherently thin-slice
# sequences, not full 3D volumes -- a property of this dataset, not fixable
# by a smarter crop. Kept all 965 anyway rather than filtering to ~131
# "clean" files, to preserve ~1000-scan comparability with the
# ResEncUNet-B/U-Net-B/Primus-S checkpoints this is meant to be comparable
# to. Not a training-correctness problem: img_mask already excludes
# padded/invalid voxels from both context and loss (see
# MaskedAutoencoderViT.prepare_masks in the sibling smri_mae package) --
# low-fill files just contribute less signal per sample. See
# src/data/local_pt_dataset.py's module docstring and the sibling ToMe
# experiment's README for the full accounting.
img_size: [160, 160, 160]

epochs: 250
warmup_epochs: 25

wandb: true
wandb_entity: palinaskipar-zdro-tech
wandb_project: smri-fm-edgeloss

# All 965/10 files from asparagus's own split (fold 0) -- see the img_size
# comment above for why nothing is filtered out here. Same split as the
# sibling ToMe experiment, so results are comparable across both.
datasets:
  fomo_train:
    format: local_pt
    paths: /workspace/fomo26/processed_data/PT902_FOMO300K_HF/split_99_01_00.json#train
    shuffle: true
    drop_last: true

  fomo_val:
    format: local_pt
    paths: /workspace/fomo26/processed_data/PT902_FOMO300K_HF/split_99_01_00.json#val
    shuffle: false
    drop_last: false

batch_size: 8
accum_iter: 2
num_workers: 4
